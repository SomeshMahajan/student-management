name: CI/CD using Github Actions

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          
      - name: Build Application
        run: mvn clean package

      - name: Push Artifact to S3
        run: aws s3 cp target/*.war s3://mayurcbz.space/student.war
